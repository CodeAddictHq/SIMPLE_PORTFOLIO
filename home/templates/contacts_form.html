<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact Form</title>

<style>
*{
  font-weight:500;
  margin:0;
  padding:0;
  box-sizing:border-box;
}
nav{
  position: fixed;
  top:0px;
  height: 60px;
  width:100vw;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:1.2rem 2.5rem;
  border-bottom:1px solid var(--border);
  background-color: rgb(228, 221, 214, .90);
  font-weight: 500;
  
}
.logo{
  margin-right: 40px;
  font-size:1.5rem;font-weight:700;text-decoration:none;color:var(--ink)}
.logo span{color:var(--accent)}
nav ul{display:flex;gap:2rem;list-style:none}
nav a{color:var(--muted);text-decoration:none;font-size:.85rem}
nav a:hover{color:var(--accent)}


body{
  background:#f8f6f3;
  font-family:system-ui,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.form-box{
  width:420px;
  background:#fff;
  border:1px solid #e4ddd6;
  border-radius:10px;
  padding:20px;
}

h2{
  font-size:18px;
  margin-bottom:15px;
  color:#1a1714;
}

label{
  font-size:12px;
  color:#888;
  display:block;
  margin:10px 0 5px;
}

input, textarea{
  width:100%;
  padding:10px;
  border:1px solid #e4ddd6;
  border-radius:6px;
  outline:none;
  font-size:14px;
}

textarea{
  resize:none;
  height:120px;
}

input:focus, textarea:focus{
  border-color:#c8622a;
}

button{
  margin-top:15px;
  width:100%;
  padding:10px;
  border:none;
  background:#c8622a;
  color:#fff;
  border-radius:6px;
  cursor:pointer;
}

button:hover{
  background:#a85020;
}
</style>
</head>

<body>
<nav>
  <a class="logo">Adibs<span>.weeb</span></a>
  <ul>
    <li><a href="#about">About</a></li>
    <li><a href="#projects">Projects</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
</nav>

<div class="form-box">
  <h2></h2>

  <form method="POST", action="{% url 'register'%}">
{% csrf_token %}
    <!-- Username validation: 3–20 chars, letters/numbers/underscore -->
    <label>Making contact as</label>
    <input 
      type="text"
      name="username"
      readonly
      value="{{user}}"
      >

    <!-- Message validation -->
    <label>Message</label>
    <textarea
      name="message"
      required
      placeholder="Write your message..."
    ></textarea>

    <!-- Link validation -->
    <label>Link (optional)</label>
    <input 
      name="link"
      placeholder="https://example.com"
    >

    <button type="submit">Submit</button>
  </form>
</div>

</body>
</html>
