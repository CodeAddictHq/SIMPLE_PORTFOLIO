{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<link rel="stylesheet" href="{% static 'style.css' %}"
</head>
<body>

{% if not user.is_authenticated %}
<div style="
    display:flex;
    justify-content:center;
    align-items:center;
    height:80vh;
    font-family:Arial, sans-serif;
">
    <h1 style="
        padding:20px 40px;
        border:1px solid #e4ddd6;
        border-radius:10px;
        background:#f8f6f3;
        font-weight:500;
        color:#1a1714;
    ">
        you are logged in
    </h1>
</div>  {% elif user.is_authenticated %}
{% if messages %}
{% for message in messages %}
<div style="  
padding:10px;  
margin:10px auto;  
max-width:320px;  
border-radius:5px;  
border:1px solid #ccc;  
background-color:#f9f9f9;  
color:#333;  
text-align:center;  
">
{{ message }}
</div>
{% endfor %}
{% endif %}

<form method="POST"  
      style="max-width:320px; margin:40px auto; padding:20px; border:1px solid #ddd; border-radius:10px; font-family:Arial;">  {% csrf_token %}  

<h2 style="text-align:center; margin-bottom:20px;">login  Up</h2>  

<div style="margin-bottom:10px;">  
    <label style="display:block; margin-bottom:5px;">Username</label>  
    <input type="text" name="username" value='{{user.username}}' readonly  
           style="width:100%; padding:8px; border:1px solid #ccc; border-radius:5px;">  
</div>  


<div style="margin-bottom:10px;">  
    <label style="display:block; margin-bottom:5px;">Password</label>  
    <input type="password" name="password" id="password" required  
           style="width:100%; padding:8px; border:1px solid #ccc; border-radius:5px;">  
</div>  



<p id="error" style="color:red; display:none; font-size:13px;"></p>  

<button type="submit"  
        
        style="width:100%; padding:10px; background:black; color:white; border:none; border-radius:5px; cursor:pointer;">  
    Submit  
</button>

</form>  {% endif %}
</body>
</html>
